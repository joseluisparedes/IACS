name: Render Keep-Alive Ping

on:
  schedule:
    # Trigger every 5 minutes to mitigate GitHub Actions runner queue delays
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging Render Health Check Endpoint..."
          # Use 90 seconds timeout to accommodate Render cold start (~45s) if hibernated
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "https://iacs-3v3f.onrender.com/api/health")
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Render backend is awake and healthy!"
          else
            echo "⚠️ Status code was $HTTP_STATUS. Waiting 10s and retrying..."
            sleep 10
            RETRY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "https://iacs-3v3f.onrender.com/api/health")
            echo "Retry response: $RETRY_STATUS"
            if [ "$RETRY_STATUS" -eq 200 ]; then
              echo "✅ Render backend is now awake!"
            else
              echo "⚠️ Backend returned $RETRY_STATUS after retry."
            fi
          fi
